<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foodtruck">
<link rel="apple-touch-icon" href="icon.png.jpeg">
<title>Brut Butcher - FOODTRUCK</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #14171c;
    color: #f2ede4;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    padding-bottom: 80px;
  }
  header {
    position: relative;
    padding: calc(env(safe-area-inset-top) + 16px) 16px 12px;
    text-align: center;
    background: repeating-linear-gradient(90deg, #14171c 0 8px, #1b1f26 8px 10px);
    border-bottom: 1px solid #2a2f38;
  }
  .lock {
    position: absolute; top: calc(env(safe-area-inset-top) + 8px); right: 10px;
    background: none; border: none; font-size: 22px; padding: 6px 8px;
    cursor: pointer; opacity: .6; color: #f2ede4;
  }
  .lock.on { opacity: 1; }
  .brand { border-top: 4px solid #f2ede4; border-bottom: 4px solid #f2ede4; padding: 10px 0 14px; }
  .brand h1 { margin: 0; font-size: 38px; letter-spacing: 10px; font-weight: 700; }
  .flag { display: flex; justify-content: center; margin-top: 6px; }
  .flag span { width: 34px; height: 5px; }
  .flag .b { background: #2a4d9b; } .flag .w { background: #f2ede4; } .flag .r { background: #d63a2f; }
  .tagline { margin: 12px 0 4px; font-size: 13px; letter-spacing: 7px; color: #8b919b; }
  .sub { font-size: 18px; letter-spacing: 3px; font-weight: 500; }
  .edit-banner {
    display: none; background: #d63a2f; color: #fff; text-align: center;
    padding: 6px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
  }
  body.editing .edit-banner { display: block; }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
    position: sticky; top: 0; background: #14171c; z-index: 5;
    border-bottom: 1px solid #2a2f38;
  }
  .tab {
    flex: 0 0 auto; padding: 8px 16px; border: 2px solid #f2ede4; background: transparent;
    color: #f2ede4; font-family: inherit; font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
  }
  .tab.active { background: #f2ede4; color: #14171c; }
  .tab.add { border-style: dashed; opacity: .8; }

  main { padding: 16px; max-width: 700px; margin: 0 auto; }

  .alert {
    border: 2px solid #d63a2f; padding: 12px 14px; margin-bottom: 18px; background: rgba(214,58,47,.08);
  }
  .alert.ok { border-color: #3c9a5f; background: rgba(60,154,95,.1); }
  .alert h2 { margin: 0 0 8px; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; }
  .alert ul { margin: 0; padding-left: 18px; font-size: 16px; line-height: 1.6; }
  .alert li small { color: #8b919b; letter-spacing: 1px; }

  .cat { margin-bottom: 22px; }
  .cat-title {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #f2ede4; padding-bottom: 6px; margin-bottom: 4px;
  }
  .cat-title h3 { margin: 0; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; }
  .cat-title .count { font-size: 13px; color: #8b919b; letter-spacing: 2px; }

  .item {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid #242932; font-size: 18px;
  }
  .item label { flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .item input[type=checkbox] {
    appearance: none; -webkit-appearance: none; width: 28px; height: 28px; flex: 0 0 28px;
    border: 2px solid #f2ede4; background: transparent; margin: 0; position: relative;
  }
  .item input[type=checkbox]:checked { background: #f2ede4; }
  .item input[type=checkbox]:checked::after {
    content: ''; position: absolute; left: 8px; top: 2px; width: 7px; height: 14px;
    border: solid #14171c; border-width: 0 3px 3px 0; transform: rotate(45deg);
  }
  .item.done span { color: #6b717b; text-decoration: line-through; }
  .del { background: none; border: none; color: #6b717b; font-size: 22px; padding: 4px 8px; cursor: pointer; }

  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row input {
    flex: 1; background: #1b1f26; border: 1px solid #2a2f38; color: #f2ede4;
    padding: 10px; font-family: inherit; font-size: 16px;
  }
  .btn {
    background: #f2ede4; color: #14171c; border: none; padding: 10px 16px;
    font-family: inherit; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: #f2ede4; border: 2px solid #f2ede4; }
  .actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }

  .edit-only { display: none !important; }
  body.editing .edit-only { display: revert !important; }
  body.editing .tab.add.edit-only { display: inline-block !important; }
  body.editing .del.edit-only { display: inline-block !important; }
  body.editing .add-row.edit-only { display: flex !important; }
  body.editing .actions.edit-only { display: flex !important; }

  /* Lignes de saisie (caisse, inventaire, CRA) */
  .caisse-row, .inv-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid #242932; font-size: 18px;
  }
  .caisse-row .lbl, .inv-row .lbl { flex: 1; letter-spacing: 1px; }
  .caisse-row input, .inv-row input, .txt-input {
    width: 80px; background: #1b1f26; border: 1px solid #2a2f38; color: #f2ede4;
    padding: 10px; font-family: inherit; font-size: 18px; text-align: center;
  }
  .txt-input { width: 100%; text-align: left; }
  .caisse-row .sub-total { width: 90px; text-align: right; color: #8b919b; font-size: 16px; }
  .caisse-row .sub-total.has { color: #f2ede4; }
  .total-box {
    border: 2px solid #f2ede4; padding: 14px; margin-top: 20px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; letter-spacing: 3px; text-transform: uppercase;
  }
  .total-box strong { font-size: 28px; }
  .section-title {
    margin: 22px 0 6px; font-size: 18px; letter-spacing: 3px; text-transform: uppercase;
    border-bottom: 2px solid #f2ede4; padding-bottom: 4px;
  }
  .cols { display: flex; gap: 10px; }
  .cols > div { flex: 1; }
  .cols .col-title { text-align: center; font-size: 15px; letter-spacing: 3px; margin-bottom: 4px; color: #8b919b; }
  .hist-row { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid #242932; font-size: 16px; }
  .hist-row small { color: #8b919b; }

  .suivi-section { margin: 0 0 26px; }
  .suivi-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 8px; margin: 10px 0 14px; }
  .suivi-form label { display: block; color: #aeb3bc; font-size: 13px; letter-spacing: 1px; }
  .suivi-form input { display: block; width: 100%; margin-top: 4px; background: #1b1f26; border: 1px solid #2a2f38; color: #f2ede4; padding: 10px; font: 16px 'Oswald', sans-serif; }
  .suivi-form .btn { grid-column: 1 / -1; justify-self: start; }
  .suivi-entry { padding: 10px 4px; border-bottom: 1px solid #2a2f38; line-height: 1.7; }
  .suivi-entry strong { letter-spacing: 1px; }
  .suivi-entry .del { float: right; }
  .print-only { display: none; }
  @media print {
    body { background: #fff; color: #000; padding: 0; font-family: Arial, sans-serif; }
    header, .tabs, main { display: none !important; }
    .print-only { display: block; padding: 24px; }
    .print-only h1 { font-size: 24px; margin: 0 0 4px; }
    .print-only h2 { font-size: 17px; margin: 18px 0 6px; }
    .print-only p { margin: 0 0 16px; color: #444; }
    .print-only table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .print-only th, .print-only td { border: 1px solid #000; padding: 8px; text-align: left; }
    .print-only td.r, .print-only th.r { text-align: right; }
    .print-only .tot { font-size: 18px; font-weight: bold; margin-top: 16px; text-align: right; }
  }
</style>
</head>
<body>

<header>
  <button class="lock" id="lockBtn" aria-label="Mode édition">🔒</button>
  <div class="brand">
    <h1>BRUT BUTCHER</h1>
    <div class="flag"><span class="b"></span><span class="w"></span><span class="r"></span></div>
  </div>
  <div class="tagline">LE FAST-FOOD DU BOUCHER</div>
  <div class="sub">FOODTRUCK</div>
</header>
<div class="edit-banner">Mode édition</div>

<div class="tabs" id="tabs"></div>

<main>
  <div id="alert"></div>
  <div id="content"></div>
  <div class="actions edit-only" id="actions">
    <button class="btn ghost" id="addCat">+ Catégorie</button>
    <button class="btn ghost" id="resetTab">Tout décocher</button>
    <button class="btn ghost" id="delTab">Supprimer l'onglet</button>
  </div>
</main>

<div class="print-only" id="printArea"></div>

<script>
const KEY = 'brutbutcher_checklist_v8';
const PIN = '0109';
const INV_KEY = 'brutbutcher_inventaire_v1';
const CA_KEY = 'brutbutcher_ca_v1';
const SUIVI_KEY = 'brutbutcher_suivi_v1';
const SUIVI_NAME = 'Suivi Huile & Frigos';
const CAISSE_NAME = 'Caisse';
const INVENTAIRE_NAME = 'Inventaire';
const CA_NAME = 'CA';
let editing = false;

const defaultData = {
  active: 0,
  tabs: [
    { name: 'Mise en route', cats: [
      { name: 'Gaz', items: [ { t: 'Bonbonne de propane 13kg X2', c: false } ]},
      { name: "Distributeur d'eau", items: [ { t: 'Remplissage du bidon de 20L', c: false } ]},
      { name: 'Électricité', items: [
        { t: 'Rallonge électrique', c: false },
        { t: 'Groupe électrogène', c: false },
        { t: 'Bidon pour groupe électrogène sans plomb', c: false }
      ]}
    ]},
    { name: INVENTAIRE_NAME, cats: [], inventaire: true },
    { name: 'Équipement', cats: [
      { name: 'Trancheuses', items: [
        { t: 'Bloc de découpe 1', c: false },
        { t: 'Bloc de découpe 2', c: false },
        { t: 'Lame X2', c: false }
      ]},
      { name: 'Plancha', items: [
        { t: 'Spatule', c: false },
        { t: 'Grattoir', c: false }
      ]},
      { name: 'Friteuse', items: [
        { t: 'Panier à frites', c: false },
        { t: 'Bac à frites 1', c: false },
        { t: 'Bac à frites 2', c: false }
      ]},
      { name: 'Découpe', items: [
        { t: 'Planche à découper', c: false },
        { t: 'Couteau', c: false }
      ]},
      { name: 'Comptoir', items: [
        { t: 'Maintien chaud', c: false },
        { t: 'Bac pour sauce X2', c: false }
      ]}
    ]},
    { name: 'Mise en place', cats: [
      { name: 'Food', items: [
        { t: 'Frite', c: false },
        { t: 'Pavé', c: false },
        { t: 'Cup sauce moutarde miel', c: false },
        { t: 'Cup sauce ketchups', c: false },
        { t: 'Cup sauce mayonnaise', c: false },
        { t: 'Gros sel', c: false },
        { t: 'Sel fin', c: false },
        { t: 'Poivre', c: false }
      ]},
      { name: 'POPF', items: [
        { t: 'Fond GM', c: false },
        { t: 'Pince', c: false },
        { t: 'Serviette', c: false }
      ]},
      { name: 'Devanture', items: [ { t: 'Affiche prix X2', c: false } ]}
    ]},
    { name: 'Propreté', cats: [
      { name: 'Nettoyage', items: [
        { t: 'Lavette', c: false },
        { t: 'Spray alimentaire', c: false },
        { t: 'Dégraissant', c: false },
        { t: 'Kitchen pro', c: false }
      ]},
      { name: 'Équipement de propreté', items: [
        { t: 'Poubelle 1', c: false },
        { t: 'Poubelle 2', c: false },
        { t: 'Sac poubelle', c: false },
        { t: 'Balai + pelle', c: false },
        { t: 'Rouleau d\'essuie-tout x4', c: false }
      ]}
    ]},
    { name: 'Formulaire', cats: [
      { name: 'BookFoodtruck', items: [
        { t: 'Température des deux frigos', c: false },
        { t: 'Polarité des deux friteuses', c: false },
        { t: 'Température des deux friteuses', c: false }
      ]},
      { name: 'Open caisse', items: [
        { t: 'Comptage billet + pièce', c: false },
        { t: 'Mise en route des deux TPE', c: false },
        { t: 'Rouleau TPE', c: false },
        { t: 'Chargeur TPE', c: false }
      ]}
    ]},
    { name: CAISSE_NAME, cats: [], caisse: true },
    { name: SUIVI_NAME, cats: [], suivi: true },
    { name: CA_NAME, cats: [], ca: true }
  ]
};

/* Inventaire : articles et unité */
const INV_ITEMS = [
  { id: 'frites', label: 'Frites', unit: 'kg', step: '0.1' },
  { id: 'pave', label: 'Pavé', unit: '', step: '1' },
  { id: 'cup_mayo', label: 'Cup sauce mayonnaise', unit: '', step: '1' },
  { id: 'cup_ketchup', label: 'Cup sauce ketchup', unit: '', step: '1' },
  { id: 'cup_moutarde', label: 'Cup sauce moutarde / miel', unit: '', step: '1' },
  { id: 'pince', label: 'Pince', unit: '', step: '1' },
  { id: 'serviette', label: 'Serviette', unit: '', step: '1' }
];
const CRA_ITEMS = [
  { id: 'pave_frites', label: 'Pavé frites', prix: 15 },
  { id: 'grandes_frites', label: 'Grandes frites', prix: 6 }
];

const DENOMS = [
  { label: '1 centime', v: 0.01 }, { label: '2 centimes', v: 0.02 },
  { label: '5 centimes', v: 0.05 }, { label: '10 centimes', v: 0.10 },
  { label: '20 centimes', v: 0.20 }, { label: '50 centimes', v: 0.50 },
  { label: '1 €', v: 1 }, { label: '2 €', v: 2 },
  { label: 'Billet 5 €', v: 5 }, { label: 'Billet 10 €', v: 10 },
  { label: 'Billet 20 €', v: 20 }, { label: 'Billet 50 €', v: 50 },
  { label: 'Billet 100 €', v: 100 }
];

let data;
try { data = JSON.parse(localStorage.getItem(KEY)) || defaultData; }
catch (e) { data = defaultData; }
if (!data.caisseQty) data.caisseQty = {};

/* Données inventaire et CA, séparées pour ne pas être effacées par "Réinitialiser" */
let inv;
try { inv = JSON.parse(localStorage.getItem(INV_KEY)) || {}; } catch (e) { inv = {}; }
if (!inv.debut) inv.debut = {};
if (!inv.fin) inv.fin = {};
if (!inv.cra) inv.cra = {};
if (!inv.evenement) inv.evenement = { nom: '', date: '' };

let caHist;
try { caHist = JSON.parse(localStorage.getItem(CA_KEY)) || []; } catch (e) { caHist = []; }

/* Suivi opérationnel séparé : non affecté par la réinitialisation checklist */
let suivi;
try { suivi = JSON.parse(localStorage.getItem(SUIVI_KEY)) || {}; } catch (e) { suivi = {}; }
if (!Array.isArray(suivi.vidanges)) suivi.vidanges = [];
if (!Array.isArray(suivi.polarite)) suivi.polarite = [];
if (!Array.isArray(suivi.frigos)) suivi.frigos = [];
if (!Array.isArray(suivi.hottes)) suivi.hottes = [];
function saveSuivi() { localStorage.setItem(SUIVI_KEY, JSON.stringify(suivi)); }

// Complète une checklist déjà enregistrée sans remplacer les données existantes.
function ensureChecklistItem(tabName, categoryName, label) {
  const tab = data.tabs.find(t => t.name === tabName);
  if (!tab) return;
  let cat = tab.cats.find(c => c.name === categoryName);
  if (!cat) { cat = { name: categoryName, items: [] }; tab.cats.push(cat); }
  if (!cat.items.some(i => i.t === label)) cat.items.push({ t: label, c: false });
}
ensureChecklistItem('Équipement', 'Friteuse', 'Huile 10 kilos');
ensureChecklistItem('Formulaire', 'Open caisse', 'Rouleau TPE');
ensureChecklistItem('Formulaire', 'Open caisse', 'Chargeur TPE');
if (!data.tabs.some(t => t.suivi || t.name === SUIVI_NAME)) {
  const caIndex = data.tabs.findIndex(t => t.ca || t.name === CA_NAME);
  data.tabs.splice(caIndex < 0 ? data.tabs.length : caIndex, 0, { name: SUIVI_NAME, cats: [], suivi: true });
  save();
} else {
  const suiviTab = data.tabs.find(t => t.suivi || t.name === SUIVI_NAME);
  suiviTab.suivi = true; suiviTab.name = SUIVI_NAME;
  const caIndex = data.tabs.findIndex(t => t.ca || t.name === CA_NAME);
  const suiviIndex = data.tabs.indexOf(suiviTab);
  if (caIndex >= 0 && suiviIndex > caIndex) {
    data.tabs.splice(suiviIndex, 1); data.tabs.splice(caIndex, 0, suiviTab);
  }
  save();
}

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
function saveInv() { localStorage.setItem(INV_KEY, JSON.stringify(inv)); }
function saveCA() { localStorage.setItem(CA_KEY, JSON.stringify(caHist)); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c]));
}
function eur(n) { return n.toFixed(2).replace('.', ',') + ' €'; }
function num(x) { return parseFloat(x) || 0; }

function caisseTotal() {
  let tot = 0;
  DENOMS.forEach((d, i) => { tot += (parseInt(data.caisseQty[i]) || 0) * d.v; });
  return Math.round(tot * 100) / 100;
}

/* CRA : chiffre d'affaires de la prestation */
function craTotal() {
  let tot = 0;
  CRA_ITEMS.forEach(c => { tot += num(inv.cra[c.id]) * c.prix; });
  return Math.round(tot * 100) / 100;
}

/* Verrouillage */
function updateLockUI() {
  document.body.classList.toggle('editing', editing);
  const lb = document.getElementById('lockBtn');
  lb.textContent = editing ? '🔓' : '🔒';
  lb.classList.toggle('on', editing);
}
document.getElementById('lockBtn').onclick = () => {
  if (editing) {
    editing = false;
    updateLockUI(); render();
  } else {
    const code = prompt('Code pour passer en mode édition :');
    if (code === null) return;
    if (code === PIN) {
      editing = true;
      updateLockUI(); render();
    } else {
      alert('Code incorrect.');
    }
  }
};

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  data.tabs.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === data.active ? ' active' : '');
    b.textContent = t.name;
    b.onclick = () => { data.active = i; save(); render(); };
    b.ondblclick = () => {
      if (!editing) return;
      const n = prompt("Renommer l'onglet :", t.name);
      if (n && n.trim()) { t.name = n.trim(); save(); render(); }
    };
    tabsEl.appendChild(b);
  });
  if (editing) {
    const add = document.createElement('button');
    add.className = 'tab add'; add.textContent = '+';
    add.onclick = () => {
      const n = prompt('Nom du nouvel onglet :');
      if (n && n.trim()) {
        data.tabs.push({ name: n.trim(), cats: [] });
        data.active = data.tabs.length - 1; save(); render();
      }
    };
    tabsEl.appendChild(add);
  }
}

/* ===== Onglet INVENTAIRE ===== */
function renderInventaire() {
  document.getElementById('alert').innerHTML = '';
  document.getElementById('actions').style.display = 'none';
  const content = document.getElementById('content');
  content.innerHTML = '';

  const top = document.createElement('div');
  top.innerHTML =
    '<div class="section-title">Événement</div>' +
    '<input class="txt-input" id="evNom" placeholder="Veuillez entrer le nom de l\'événement" value="' + esc(inv.evenement.nom) + '">' +
    '<input class="txt-input" id="evDate" type="date" style="margin-top:8px" value="' + esc(inv.evenement.date) + '">';
  content.appendChild(top);
  top.querySelector('#evNom').oninput = e => { inv.evenement.nom = e.target.value; saveInv(); };
  top.querySelector('#evDate').oninput = e => { inv.evenement.date = e.target.value; saveInv(); };

  const title = document.createElement('div');
  title.className = 'section-title';
  title.textContent = 'Inventaire';
  content.appendChild(title);

  const head = document.createElement('div');
  head.className = 'cols';
  head.innerHTML = '<div class="col-title">Inventaire début</div><div class="col-title">Inventaire fin</div>';
  content.appendChild(head);

  INV_ITEMS.forEach(it => {
    const row = document.createElement('div');
    row.className = 'inv-row';
    row.innerHTML =
      '<span class="lbl">' + esc(it.label) + (it.unit ? ' (' + it.unit + ')' : '') + '</span>' +
      '<input type="number" inputmode="decimal" step="' + it.step + '" min="0" placeholder="0" value="' + (inv.debut[it.id] ?? '') + '">' +
      '<input type="number" inputmode="decimal" step="' + it.step + '" min="0" placeholder="0" value="' + (inv.fin[it.id] ?? '') + '">';
    const [dInp, fInp] = row.querySelectorAll('input');
    dInp.oninput = () => { inv.debut[it.id] = dInp.value; saveInv(); };
    fInp.oninput = () => { inv.fin[it.id] = fInp.value; saveInv(); };
    content.appendChild(row);
  });

  const craTitle = document.createElement('div');
  craTitle.className = 'section-title';
  craTitle.textContent = 'CRA (ventes TPE)';
  content.appendChild(craTitle);

  const craBox = document.createElement('div');
  content.appendChild(craBox);
  function drawCra() {
    let html = '';
    CRA_ITEMS.forEach(c => {
      const q = inv.cra[c.id] ?? '';
      html += '<div class="caisse-row"><span class="lbl">' + esc(c.label) + ' (' + c.prix + ' €)</span>' +
        '<input type="number" inputmode="numeric" min="0" placeholder="0" data-cra="' + c.id + '" value="' + q + '">' +
        '<span class="sub-total">' + eur(num(q) * c.prix) + '</span></div>';
    });
    html += '<div class="total-box"><span>CA</span><strong id="caVal">' + eur(craTotal()) + '</strong></div>';
    craBox.innerHTML = html;
    craBox.querySelectorAll('input[data-cra]').forEach(inp => {
      inp.oninput = () => {
        inv.cra[inp.dataset.cra] = inp.value;
        saveInv();
        const c = CRA_ITEMS.find(x => x.id === inp.dataset.cra);
        inp.parentElement.querySelector('.sub-total').textContent = eur(num(inp.value) * c.prix);
        document.getElementById('caVal').textContent = eur(craTotal());
      };
    });
  }
  drawCra();

  const act = document.createElement('div');
  act.className = 'actions';
  act.innerHTML =
    '<button class="btn" id="pdfInv">Générer le PDF</button>' +
    '<button class="btn ghost" id="saveCA">Enregistrer dans CA</button>' +
    '<button class="btn ghost" id="resetService">Réinitialiser le service</button>';
  content.appendChild(act);

  document.getElementById('pdfInv').onclick = generateInventairePDF;
  document.getElementById('saveCA').onclick = saveCAEntry;
  document.getElementById('resetService').onclick = resetService;
}

function restant(id) {
  const d = num(inv.debut[id]);
  const f = num(inv.fin[id]);
  return d - f;
}

function generateInventairePDF() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR') + ' à ' +
    now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const ev = inv.evenement.nom ? esc(inv.evenement.nom) : 'Événement non nommé';
  const evDate = inv.evenement.date ? new Date(inv.evenement.date).toLocaleDateString('fr-FR') : '';

  let rows = '';
  INV_ITEMS.forEach(it => {
    const d = inv.debut[it.id] ?? '';
    const f = inv.fin[it.id] ?? '';
    const r = restant(it.id);
    rows += '<tr><td>' + esc(it.label) + (it.unit ? ' (' + it.unit + ')' : '') + '</td>' +
      '<td class="r">' + (d === '' ? '-' : d) + '</td>' +
      '<td class="r">' + (f === '' ? '-' : f) + '</td>' +
      '<td class="r">' + (d === '' || f === '' ? '-' : r.toString().replace('.', ',')) + '</td></tr>';
  });

  let craRows = '';
  CRA_ITEMS.forEach(c => {
    const q = num(inv.cra[c.id]);
    craRows += '<tr><td>' + esc(c.label) + ' (' + c.prix + ' €)</td><td class="r">' + q + '</td><td class="r">' + eur(q * c.prix) + '</td></tr>';
  });

  document.getElementById('printArea').innerHTML =
    '<h1>Brut Butcher - Récapitulatif événement</h1>' +
    '<p>' + ev + (evDate ? ' - ' + evDate : '') + '<br>Édité le ' + dateStr + '</p>' +
    '<h2>Inventaire</h2>' +
    '<table><thead><tr><th>Article</th><th class="r">Début</th><th class="r">Fin</th><th class="r">Restant</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<h2>CRA</h2>' +
    '<table><thead><tr><th>Formule</th><th class="r">Vendus</th><th class="r">Montant</th></tr></thead>' +
    '<tbody>' + craRows + '</tbody></table>' +
    '<div class="tot">CHIFFRE D\'AFFAIRES : ' + eur(craTotal()) + '</div>';
  window.print();
}

/* Enregistre le CA de l'événement dans l'historique */
function saveCAEntry() {
  if (!inv.evenement.nom && !inv.evenement.date) {
    alert("Renseignez le nom et la date de l'événement d'abord.");
    return;
  }
  caHist.push({
    nom: inv.evenement.nom || 'Sans nom',
    date: inv.evenement.date || new Date().toISOString().slice(0, 10),
    ca: craTotal()
  });
  saveCA();
  alert('CA enregistré : ' + eur(craTotal()));
}

/* Remet l'inventaire fin en début, décoche la checklist, garde le CA */
function resetService() {
  if (!confirm("Réinitialiser le service ? La checklist sera décochée, l'inventaire fin deviendra l'inventaire début et le CRA sera vidé.")) return;
  const newDebut = {};
  INV_ITEMS.forEach(it => { newDebut[it.id] = inv.fin[it.id] ?? ''; });
  inv.debut = newDebut;
  inv.fin = {};
  inv.cra = {};
  inv.evenement = { nom: '', date: '' };
  saveInv();
  data.tabs.forEach(t => (t.cats || []).forEach(c => c.items.forEach(i => i.c = false)));
  data.caisseQty = {};
  save();
  render();
}

/* ===== Onglet CA : historique par année et par mois ===== */
function renderCA() {
  document.getElementById('alert').innerHTML = '';
  document.getElementById('actions').style.display = 'none';
  const content = document.getElementById('content');

  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7)); weekStart.setHours(0,0,0,0);
  const monthStr = today.slice(0, 7);
  const yearStr = today.slice(0, 4);

  const sumBy = fn => caHist.filter(fn).reduce((s, e) => s + num(e.ca), 0);
  const jour = sumBy(e => e.date === today);
  const semaine = sumBy(e => new Date(e.date) >= weekStart);
  const mois = sumBy(e => e.date.slice(0, 7) === monthStr);
  const annee = sumBy(e => e.date.slice(0, 4) === yearStr);

  content.innerHTML =
    '<div class="section-title">Chiffre d\'affaires</div>' +
    '<div class="caisse-row"><span class="lbl">Aujourd\'hui</span><strong>' + eur(jour) + '</strong></div>' +
    '<div class="caisse-row"><span class="lbl">Cette semaine</span><strong>' + eur(semaine) + '</strong></div>' +
    '<div class="caisse-row"><span class="lbl">Ce mois</span><strong>' + eur(mois) + '</strong></div>' +
    '<div class="caisse-row"><span class="lbl">Cette année</span><strong>' + eur(annee) + '</strong></div>';

  // Historique groupé par année puis mois
  const groups = {};
  caHist.forEach(e => {
    const y = e.date.slice(0, 4);
    const m = e.date.slice(0, 7);
    groups[y] = groups[y] || {};
    groups[y][m] = groups[y][m] || [];
    groups[y][m].push(e);
  });
  const years = Object.keys(groups).sort().reverse();
  if (years.length === 0) {
    content.innerHTML += '<p style="color:#8b919b;text-align:center;margin-top:30px">Aucun événement enregistré.</p>';
  }
  years.forEach(y => {
    const yTot = Object.values(groups[y]).flat().reduce((s, e) => s + num(e.ca), 0);
    content.innerHTML += '<div class="section-title">' + y + ' - ' + eur(yTot) + '</div>';
    Object.keys(groups[y]).sort().reverse().forEach(m => {
      const mTot = groups[y][m].reduce((s, e) => s + num(e.ca), 0);
      const label = new Date(m + '-01').toLocaleDateString('fr-FR', { month: 'long' });
      content.innerHTML += '<div class="cat-title"><h3>' + esc(label) + '</h3><span class="count">' + eur(mTot) + '</span></div>';
      groups[y][m].slice().reverse().forEach(e => {
        const d = new Date(e.date).toLocaleDateString('fr-FR');
        content.innerHTML += '<div class="hist-row"><span>' + esc(e.nom) + ' <small>' + d + '</small></span><strong>' + eur(num(e.ca)) + '</strong></div>';
      });
    });
  });
}

/* ===== Onglet CAISSE ===== */
function renderCaisse() {
  document.getElementById('alert').innerHTML = '';
  document.getElementById('actions').style.display = 'none';
  const content = document.getElementById('content');
  content.innerHTML = '<div class="cat"><div class="cat-title"><h3>Comptage de la caisse</h3></div></div>';
  const wrap = content.firstChild;

  DENOMS.forEach((d, i) => {
    const row = document.createElement('div');
    row.className = 'caisse-row';
    const q = parseInt(data.caisseQty[i]) || 0;
    row.innerHTML =
      '<span class="lbl">' + esc(d.label) + '</span>' +
      '<input type="number" inputmode="numeric" min="0" placeholder="0" value="' + (q || '') + '">' +
      '<span class="sub-total' + (q ? ' has' : '') + '">' + eur(q * d.v) + '</span>';
    const inp = row.querySelector('input');
    const subEl = row.querySelector('.sub-total');
    inp.oninput = () => {
      const val = Math.max(0, parseInt(inp.value) || 0);
      data.caisseQty[i] = val;
      subEl.textContent = eur(val * d.v);
      subEl.className = 'sub-total' + (val ? ' has' : '');
      document.getElementById('totalVal').textContent = eur(caisseTotal());
      save();
    };
    wrap.appendChild(row);
  });

  const total = document.createElement('div');
  total.className = 'total-box';
  total.innerHTML = '<span>Total</span><strong id="totalVal">' + eur(caisseTotal()) + '</strong>';
  content.appendChild(total);

  const act = document.createElement('div');
  act.className = 'actions';
  act.innerHTML =
    '<button class="btn" id="pdfBtn">Générer le PDF</button>' +
    '<button class="btn ghost" id="clearCaisse">Remettre à zéro</button>';
  content.appendChild(act);

  document.getElementById('pdfBtn').onclick = generateCaissePDF;
  document.getElementById('clearCaisse').onclick = () => {
    if (confirm('Remettre toute la caisse à zéro ?')) { data.caisseQty = {}; save(); render(); }
  };
}

function generateCaissePDF() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR') + ' à ' +
    now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  let rows = '';
  DENOMS.forEach((d, i) => {
    const q = parseInt(data.caisseQty[i]) || 0;
    if (q > 0) {
      rows += '<tr><td>' + esc(d.label) + '</td><td class="r">' + q + '</td><td class="r">' + eur(q * d.v) + '</td></tr>';
    }
  });
  if (!rows) rows = '<tr><td colspan="3">Aucune quantité saisie</td></tr>';
  document.getElementById('printArea').innerHTML =
    '<h1>Brut Butcher - Fond de caisse</h1>' +
    '<p>Établi le ' + dateStr + '</p>' +
    '<table><thead><tr><th>Pièce / Billet</th><th class="r">Quantité</th><th class="r">Montant</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="tot">TOTAL : ' + eur(caisseTotal()) + '</div>';
  window.print();
}

/* ===== Rendu général ===== */
function htmlEscape(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
    '&': '&', '<': '<', '>': '>', '"': '"', "'": '''
  })[ch]);
}
function displayDate(value) {
  if (!value) return '—';
  const parts = value.split('-');
  return parts.length === 3 ? parts[2] + '/' + parts[1] + '/' + parts[0] : value;
}
function dateToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function sortedEntries(entries) {
  return entries.map((entry, index) => ({ entry, index })).sort((a, b) =>
    String(b.entry.date || '').localeCompare(String(a.entry.date || '')) || b.index - a.index
  ).map(x => x.entry);
}
function renderSuivi() {
  document.getElementById('alert').innerHTML = '';
  document.getElementById('actions').style.display = 'none';
  const content = document.getElementById('content');
  const escHtml = htmlEscape;
  const section = (title, id, fields, entries, format) => {
    let html = '<section class="suivi-section"><h2 class="section-title">' + title + '</h2>' +
      '<form class="suivi-form" id="' + id + '">';
    fields.forEach(f => { html += '<label>' + f.label + '<input name="' + f.name + '" type="' + (f.type || 'text') + '"' +
      (f.step ? ' step="' + f.step + '"' : '') + (f.min != null ? ' min="' + f.min + '"' : '') +
      (f.required ? ' required' : '') + (f.type === 'date' && f.today ? ' value="' + dateToday() + '"' : '') +
      ' placeholder="' + (f.placeholder || '') + '"></label>'; });
    html += '<button class="btn" type="submit">Ajouter à l’historique</button></form>';
    const ordered = sortedEntries(entries);
    html += ordered.length ? ordered.map((entry, index) => '<div class="suivi-entry">' + format(entry) +
      (editing ? '<button class="del edit-only" data-del="' + index + '" aria-label="Supprimer cette ligne">×</button>' : '') + '</div>').join('') :
      '<p style="color:#8b919b">Aucun historique enregistré.</p>';
    html += '</section>';
    return html;
  };
  content.innerHTML =
    section('Vidange huile', 'formVidange', [
      { name: 'date', label: 'Date de vidange', type: 'date', today: true, required: true },
      { name: 'cuve1', label: 'Cuve 1', placeholder: 'Note / statut' },
      { name: 'cuve2', label: 'Cuve 2', placeholder: 'Note / statut' },
      { name: 'nettoyageDate', label: 'Date du nettoyage', type: 'date' }
    ], suivi.vidanges, e => '<strong>' + escHtml(displayDate(e.date)) + '</strong> — Cuve 1 : ' + escHtml(e.cuve1 || '—') +
      ' · Cuve 2 : ' + escHtml(e.cuve2 || '—') + ' · Nettoyage : ' + escHtml(displayDate(e.nettoyageDate))) +
    section('Polarité & degré d’huile', 'formPolarite', [
      { name: 'date', label: 'Date', type: 'date', today: true, required: true },
      { name: 'polarite1', label: 'Cuve 1 — polarité', placeholder: 'Polarité' },
      { name: 'degre1', label: 'Cuve 1 — degré', type: 'number', step: 'any', placeholder: 'Degré' },
      { name: 'polarite2', label: 'Cuve 2 — polarité', placeholder: 'Polarité' },
      { name: 'degre2', label: 'Cuve 2 — degré', type: 'number', step: 'any', placeholder: 'Degré' }
			        ], suivi.polarite, e => '<strong>' + escHtml(displayDate(e.date)) + '</strong> — Cuve 1 : polarité ' + escHtml(e.polarite1 || '—') +
      ', degré ' + escHtml(e.degre1 || '—') + ' · Cuve 2 : polarité ' + escHtml(e.polarite2 || '—') + ', degré ' + escHtml(e.degre2 || '—')) +
    section('Températures frigos', 'formFrigos', [
      { name: 'date', label: 'Date', type: 'date', today: true, required: true },
      { name: 'frigo1', label: 'Frigo 1 — température', type: 'number', step: 'any', placeholder: '°C' },
      { name: 'frigo2', label: 'Frigo 2 — température', type: 'number', step: 'any', placeholder: '°C' }
    ], suivi.frigos, e => '<strong>' + escHtml(displayDate(e.date)) + '</strong> — Frigo 1 : ' + escHtml(e.frigo1 || '—') + ' °C · Frigo 2 : ' + escHtml(e.frigo2 || '—') + ' °C') +
    section('Nettoyage des hottes', 'formHottes', [
      { name: 'date', label: 'Date du nettoyage', type: 'date', today: true, required: true }
    ], suivi.hottes, e => '<strong>' + escHtml(displayDate(e.date)) + '</strong>') +
    '<div class="actions"><button class="btn ghost" id="generateSuiviPDF">Générer PDF</button></div>';

  const bindForm = (id, key, names) => {
    const form = document.getElementById(id);
    form.onsubmit = event => {
      event.preventDefault();
      const entry = {};
      names.forEach(name => { entry[name] = form.elements[name].value.trim(); });
      if (!entry.date) return;
      suivi[key].unshift(entry);
      saveSuivi(); renderSuivi();
    };
  };
  bindForm('formVidange', 'vidanges', ['date', 'cuve1', 'cuve2', 'nettoyageDate']);
  bindForm('formPolarite', 'polarite', ['date', 'polarite1', 'degre1', 'polarite2', 'degre2']);
  bindForm('formFrigos', 'frigos', ['date', 'frigo1', 'frigo2']);
  bindForm('formHottes', 'hottes', ['date']);
  content.querySelectorAll('[data-del]').forEach(button => {
    button.onclick = () => {
      if (!editing) return;
      const container = button.closest('.suivi-section');
      const sectionIndex = Array.from(content.querySelectorAll('.suivi-section')).indexOf(container);
      const key = ['vidanges', 'polarite', 'frigos', 'hottes'][sectionIndex];
      const ordered = sortedEntries(suivi[key]);
      const rowIndex = Number(button.dataset.del);
      const target = ordered[rowIndex];
      suivi[key].splice(suivi[key].indexOf(target), 1);
      saveSuivi(); renderSuivi();
    };
  });
  document.getElementById('generateSuiviPDF').onclick = generateSuiviPDF;
}
function generateSuiviPDF() {
  const table = (title, headers, rows) => '<h2>' + htmlEscape(title) + '</h2><table><thead><tr>' +
    headers.map(h => '<th>' + htmlEscape(h) + '</th>').join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(row => '<tr>' + row.map(v => '<td>' + htmlEscape(v || '—') + '</td>').join('') + '</tr>').join('') :
      '<tr><td colspan="' + headers.length + '">Aucune donnée enregistrée.</td></tr>') + '</tbody></table>';
  const rowsVidange = sortedEntries(suivi.vidanges).map(e => [displayDate(e.date), e.cuve1, e.cuve2, displayDate(e.nettoyageDate)]);
  const rowsPolarite = sortedEntries(suivi.polarite).map(e => [displayDate(e.date), e.polarite1, e.degre1, e.polarite2, e.degre2]);
  const rowsFrigos = sortedEntries(suivi.frigos).map(e => [displayDate(e.date), e.frigo1, e.frigo2]);
  const rowsHottes = sortedEntries(suivi.hottes).map(e => [displayDate(e.date)]);
  const w = window.open('', '_blank');
  if (!w) { alert('Autorisez les fenêtres pop-up pour générer le PDF.'); return; }
  w.document.open();
  w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Suivi Huile & Frigos</title><style>body{font:14px Arial,sans-serif;margin:24px;color:#111}h1{font-size:22px}h2{font-size:17px;margin:22px 0 8px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{border:1px solid #555;padding:7px;text-align:left}th{background:#eee}@media print{body{margin:12mm}}</style></head><body><h1>Suivi Huile & Frigos</h1>' +
    table('Vidange huile', ['Date', 'Cuve 1', 'Cuve 2', 'Nettoyage — date'], rowsVidange) +
    table('Polarité & degré d’huile', ['Date', 'Cuve 1 — polarité', 'Cuve 1 — degré', 'Cuve 2 — polarité', 'Cuve 2 — degré'], rowsPolarite) +
    table('Températures frigos', ['Date', 'Frigo 1 (°C)', 'Frigo 2 (°C)'], rowsFrigos) +
    table('Nettoyage des hottes', ['Date du nettoyage'], rowsHottes) +
    '<script>window.onload=function(){window.print();};<\/script></body></html>');
  w.document.close();
}

function render() {
  if (data.active >= data.tabs.length) data.active = 0;
  const tab = data.tabs[data.active];
  renderTabs();

  if (tab.caisse) { renderCaisse(); return; }
  if (tab.inventaire) { renderInventaire(); return; }
  if (tab.ca) { renderCA(); return; }
  if (tab.suivi || tab.name === SUIVI_NAME) { renderSuivi(); return; }
  document.getElementById('actions').style.display = '';

  const missing = [];
  tab.cats.forEach(cat => cat.items.forEach(it => { if (!it.c) missing.push({ cat: cat.name, t: it.t }); }));
  const alertEl = document.getElementById('alert');
  if (tab.cats.length === 0) {
    alertEl.innerHTML = '';
  } else if (missing.length === 0) {
    alertEl.innerHTML = '<div class="alert ok"><h2>Tout est prêt, bon service</h2></div>';
  } else {
    alertEl.innerHTML = '<div class="alert"><h2>À régler avant le service (' + missing.length + ')</h2><ul>' +
      missing.map(m => '<li>' + esc(m.t) + ' <small>— ' + esc(m.cat) + '</small></li>').join('') +
      '</ul></div>';
  }

  const content = document.getElementById('content');
  content.innerHTML = '';
  if (tab.cats.length === 0) {
    content.innerHTML = '<p style="color:#8b919b;text-align:center;margin-top:30px">' +
      (editing ? 'Aucune catégorie. Appuyez sur « + Catégorie ».' : 'Aucune catégorie.') + '</p>';
  }
  tab.cats.forEach((cat, ci) => {
    const done = cat.items.filter(i => i.c).length;
    const div = document.createElement('div');
    div.className = 'cat';
    div.innerHTML =
      '<div class="cat-title"><h3>' + esc(cat.name) + '</h3><span class="count">' + done + '/' + cat.items.length + '</span></div>';
    cat.items.forEach((it, ii) => {
      const row = document.createElement('div');
      row.className = 'item' + (it.c ? ' done' : '');
      row.innerHTML = '<label><input type="checkbox"' + (it.c ? ' checked' : '') + '><span>' + esc(it.t) + '</span></label>' +
        '<button class="del edit-only" aria-label="Supprimer">×</button>';
      row.querySelector('input').onchange = e => { it.c = e.target.checked; save(); render(); };
      row.querySelector('.del').onclick = () => { cat.items.splice(ii, 1); save(); render(); };
      div.appendChild(row);
    });
    const form = document.createElement('div');
    form.className = 'add-row edit-only';
    form.innerHTML = '<input type="text" placeholder="Ajouter une ligne…"><button class="btn">OK</button>';
    const inp = form.querySelector('input');
    const addItem = () => {
      const v = inp.value.trim();
      if (v) { cat.items.push({ t: v, c: false }); save(); render(); }
    };
    form.querySelector('button').onclick = addItem;
    inp.onkeydown = e => { if (e.key === 'Enter') addItem(); };
    div.appendChild(form);
    content.appendChild(div);
  });
}

document.getElementById('addCat').onclick = () => {
  const n = prompt('Nom de la catégorie :');
  if (n && n.trim()) { data.tabs[data.active].cats.push({ name: n.trim(), items: [] }); save(); render(); }
};
document.getElementById('resetTab').onclick = () => {
  if (confirm('Tout décocher dans cet onglet ?')) {
    data.tabs[data.active].cats.forEach(c => c.items.forEach(i => i.c = false));
    save(); render();
  }
};
document.getElementById('delTab').onclick = () => {
  if (data.tabs.length === 1) { alert('Il faut garder au moins un onglet.'); return; }
  if (confirm('Supprimer cet onglet ?')) {
    data.tabs.splice(data.active, 1); data.active = 0; save(); render();
  }
};

updateLockUI();
render();

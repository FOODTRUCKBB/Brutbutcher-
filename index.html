<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist">
<title>Brut Butcher - FOODTRUCK</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #14171c;
    color: #f2ede4;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    padding-bottom: 80px;
  }
  header {
    padding: calc(env(safe-area-inset-top) + 16px) 16px 12px;
    text-align: center;
    background: repeating-linear-gradient(90deg, #14171c 0 8px, #1b1f26 8px 10px);
    border-bottom: 1px solid #2a2f38;
  }
  .brand { border-top: 4px solid #f2ede4; border-bottom: 4px solid #f2ede4; padding: 10px 0 14px; }
  .brand h1 { margin: 0; font-size: 38px; letter-spacing: 10px; font-weight: 700; }
  .flag { display: flex; justify-content: center; margin-top: 6px; }
  .flag span { width: 34px; height: 5px; }
  .flag .b { background: #2a4d9b; } .flag .w { background: #f2ede4; } .flag .r { background: #d63a2f; }
  .tagline { margin: 12px 0 4px; font-size: 13px; letter-spacing: 7px; color: #8b919b; }
  .sub { font-size: 18px; letter-spacing: 3px; font-weight: 500; }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
    position: sticky; top: 0; background: #14171c; z-index: 5;
    border-bottom: 1px solid #2a2f38;
  }
  .tab {
    flex: 0 0 auto; padding: 8px 16px; border: 2px solid #f2ede4; background: transparent;
    color: #f2ede4; font-family: inherit; font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
  }
  .tab.active { background: #f2ede4; color: #14171c; }
  .tab.add { border-style: dashed; opacity: .8; }

  main { padding: 16px; max-width: 700px; margin: 0 auto; }

  .alert {
    border: 2px solid #d63a2f; padding: 12px 14px; margin-bottom: 18px; background: rgba(214,58,47,.08);
  }
  .alert.ok { border-color: #3c9a5f; background: rgba(60,154,95,.1); }
  .alert h2 { margin: 0 0 8px; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; }
  .alert ul { margin: 0; padding-left: 18px; font-size: 16px; line-height: 1.6; }
  .alert li small { color: #8b919b; letter-spacing: 1px; }

  .cat { margin-bottom: 22px; }
  .cat-title {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #f2ede4; padding-bottom: 6px; margin-bottom: 4px;
  }
  .cat-title h3 { margin: 0; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; }
  .cat-title .count { font-size: 13px; color: #8b919b; letter-spacing: 2px; }

  .item {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid #242932; font-size: 18px;
  }
  .item label { flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .item input[type=checkbox] {
    appearance: none; -webkit-appearance: none; width: 28px; height: 28px; flex: 0 0 28px;
    border: 2px solid #f2ede4; background: transparent; margin: 0; position: relative;
  }
  .item input[type=checkbox]:checked { background: #f2ede4; }
  .item input[type=checkbox]:checked::after {
    content: ''; position: absolute; left: 8px; top: 2px; width: 7px; height: 14px;
    border: solid #14171c; border-width: 0 3px 3px 0; transform: rotate(45deg);
  }
  .item.done span { color: #6b717b; text-decoration: line-through; }
  .del { background: none; border: none; color: #6b717b; font-size: 22px; padding: 4px 8px; cursor: pointer; }

  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row input {
    flex: 1; background: #1b1f26; border: 1px solid #2a2f38; color: #f2ede4;
    padding: 10px; font-family: inherit; font-size: 16px;
  }
  .btn {
    background: #f2ede4; color: #14171c; border: none; padding: 10px 16px;
    font-family: inherit; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: #f2ede4; border: 2px solid #f2ede4; }
  .actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>BRUT BUTCHER</h1>
    <div class="flag"><span class="b"></span><span class="w"></span><span class="r"></span></div>
  </div>
  <div class="tagline">LE FAST-FOOD DU BOUCHER</div>
  <div class="sub">CHECKLIST</div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <div id="alert"></div>
  <div id="content"></div>
  <div class="actions">
    <button class="btn ghost" id="addCat">+ Catégorie</button>
    <button class="btn ghost" id="resetTab">Tout décocher</button>
    <button class="btn ghost" id="delTab">Supprimer l'onglet</button>
  </div>
</main>

<script>
 const KEY = 'brutbutcher_checklist_v6';

const defaultData = {
  active: 0,
  tabs: [
    { name: 'Mise en route', cats: [
      { name: 'Gaz', items: [ { t: 'Bonbonne de propane 13kg X2', c: false } ]},
      { name: "Distributeur d'eau", items: [ { t: 'Remplissage du bidon de 20L', c: false } ]},
      { name: 'Électricité', items: [
        { t: 'Rallonge électrique', c: false },
        { t: 'Groupe électrogène', c: false },
        { t: 'Bidon pour groupe électrogène sans plomb', c: false }
      ]}
    ]},
    { name: 'Équipement', cats: [
      { name: 'Trancheuses', items: [
        { t: 'Bloc de découpe 1', c: false },
        { t: 'Bloc de découpe 2', c: false },
        { t: 'Lame X2', c: false }
      ]},
      { name: 'Plancha', items: [
        { t: 'Spatule', c: false },
        { t: 'Grattoir', c: false }
      ]},
      { name: 'Friteuse', items: [
        { t: 'Panier à frites', c: false },
        { t: 'Bac à frites 1', c: false },
        { t: 'Bac à frites 2', c: false }
      ]},
      { name: 'Découpe', items: [
        { t: 'Planche à découper', c: false },
        { t: 'Couteau', c: false }
      ]},
      { name: 'Comptoir', items: [
        { t: 'Maintien chaud', c: false },
        { t: 'Bac pour sauce X2', c: false }
      ]}
    ]},
    { name: 'Mise en place', cats: [
      { name: 'Food', items: [
        { t: 'Frite', c: false },
        { t: 'Pavé', c: false },
        { t: 'Cup sauce moutarde miel', c: false },
        { t: 'Cup sauce ketchups', c: false },
        { t: 'Cup sauce mayonnaise', c: false },
        { t: 'Gros sel', c: false },
        { t: 'Sel fin', c: false },
        { t: 'Poivre', c: false }
      ]},
      { name: 'POPF', items: [
        { t: 'Fond GM', c: false },
        { t: 'Pince', c: false },
        { t: 'Serviette', c: false }
      ]},
      { name: 'Devanture', items: [ { t: 'Affiche prix X2', c: false } ]}
    ]},
    { name: 'Propreté', cats: [
      { name: 'Nettoyage', items: [
        { t: 'Lavette', c: false },
        { t: 'Spray alimentaire', c: false },
        { t: 'Dégraissant', c: false },
        { t: 'Kitchen pro', c: false }
      ]},
      { name: 'Équipement de propreté', items: [
        { t: 'Poubelle 1', c: false },
        { t: 'Poubelle 2', c: false },
        { t: 'Sac poubelle', c: false },
        { t: 'Balai + pelle', c: false }
      ]}
    ]},
    { name: 'Formulaire', cats: [
      { name: 'BookFoodtruck', items: [
        { t: 'Température des deux frigos', c: false },
        { t: 'Polarité des deux friteuses', c: false },
        { t: 'Température des deux friteuses', c: false }
      ]},
      { name: 'Open caisse', items: [
        { t: 'Comptage billet + pièce', c: false },
        { t: 'Mise en route des deux TPE', c: false }
      ]}
    ]}
  ]
};
let data;
try { data = JSON.parse(localStorage.getItem(KEY)) || defaultData; }
catch (e) { data = defaultData; }

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }

function render() {
  if (data.active >= data.tabs.length) data.active = 0;
  const tab = data.tabs[data.active];

  // Onglets
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  data.tabs.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === data.active ? ' active' : '');
    b.textContent = t.name;
    b.onclick = () => { data.active = i; save(); render(); };
    b.ondblclick = () => {
      const n = prompt('Renommer l\'onglet :', t.name);
      if (n && n.trim()) { t.name = n.trim(); save(); render(); }
    };
    tabsEl.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'tab add'; add.textContent = '+';
  add.onclick = () => {
    const n = prompt('Nom du nouvel onglet :');
    if (n && n.trim()) {
      data.tabs.push({ name: n.trim(), cats: [] });
      data.active = data.tabs.length - 1; save(); render();
    }
  };
  tabsEl.appendChild(add);

  // Résumé de ce qui manque
  const missing = [];
  tab.cats.forEach(cat => cat.items.forEach(it => { if (!it.c) missing.push({ cat: cat.name, t: it.t }); }));
  const alertEl = document.getElementById('alert');
  if (tab.cats.length === 0) {
    alertEl.innerHTML = '';
  } else if (missing.length === 0) {
    alertEl.innerHTML = '<div class="alert ok"><h2>Tout est prêt, bon service</h2></div>';
  } else {
    alertEl.innerHTML = '<div class="alert"><h2>À régler avant le service (' + missing.length + ')</h2><ul>' +
      missing.map(m => '<li>' + esc(m.t) + ' <small>— ' + esc(m.cat) + '</small></li>').join('') +
      '</ul></div>';
  }

  // Catégories
  const content = document.getElementById('content');
  content.innerHTML = '';
  if (tab.cats.length === 0) {
    content.innerHTML = '<p style="color:#8b919b;text-align:center;margin-top:30px">Aucune catégorie. Appuyez sur « + Catégorie ».</p>';
  }
  tab.cats.forEach((cat, ci) => {
    const done = cat.items.filter(i => i.c).length;
    const div = document.createElement('div');
    div.className = 'cat';
    div.innerHTML =
      '<div class="cat-title"><h3>' + esc(cat.name) + '</h3><span class="count">' + done + '/' + cat.items.length + '</span></div>';
    cat.items.forEach((it, ii) => {
      const row = document.createElement('div');
      row.className = 'item' + (it.c ? ' done' : '');
      row.innerHTML = '<label><input type="checkbox"' + (it.c ? ' checked' : '') + '><span>' + esc(it.t) + '</span></label>' +
        '<button class="del" aria-label="Supprimer">×</button>';
      row.querySelector('input').onchange = e => { it.c = e.target.checked; save(); render(); };
      row.querySelector('.del').onclick = () => { cat.items.splice(ii, 1); save(); render(); };
      div.appendChild(row);
    });
    const form = document.createElement('div');
    form.className = 'add-row';
    form.innerHTML = '<input type="text" placeholder="Ajouter une ligne…"><button class="btn">OK</button>';
    const inp = form.querySelector('input');
    const addItem = () => {
      const v = inp.value.trim();
      if (v) { cat.items.push({ t: v, c: false }); save(); render(); }
    };
    form.querySelector('button').onclick = addItem;
    inp.onkeydown = e => { if (e.key === 'Enter') addItem(); };
    div.appendChild(form);
    content.appendChild(div);
  });
}

document.getElementById('addCat').onclick = () => {
  const n = prompt('Nom de la catégorie :');
  if (n && n.trim()) { data.tabs[data.active].cats.push({ name: n.trim(), items: [] }); save(); render(); }
};
document.getElementById('resetTab').onclick = () => {
  if (confirm('Tout décocher dans cet onglet ?')) {
    data.tabs[data.active].cats.forEach(c => c.items.forEach(i => i.c = false));
    save(); render();
  }
};
document.getElementById('delTab').onclick = () => {
  if (data.tabs.length === 1) { alert('Il faut garder au moins un onglet.'); return; }
  if (confirm('Supprimer cet onglet ?')) {
    data.tabs.splice(data.active, 1); data.active = 0; save(); render();
  }
};

render();
</script>
</body>
</html>
